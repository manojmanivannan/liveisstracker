[project]
name = "liveisstracker"
version = "2.2.1"
description = "Interactive 3D globe showing live ISS location"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "dash>=2.14.0",
    "plotly>=5.17.0",
    "flask>=3.0.0",
    "pywebview>=4.0.0",
    "qtpy>=2.0.0",
    "PyQtWebEngine>=5.15.0",
    "typer>=0.9.0",
]

[project.scripts]
iss = "liveisstracker.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/liveisstracker"]

[project]
name = "liveisstracker"
version = "2.0.0"
description = "Interactive 3D globe showing live ISS location"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "dash>=2.14.0",
    "plotly>=5.17.0",
    "geopy>=2.4.0",
    "flask>=3.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
